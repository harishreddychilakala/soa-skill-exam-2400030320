
name: microservices-deployment

services:

  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: soa-skill-exam-2400030320
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soa-skill-exam-2400030320"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - microservices-network

  parking-service:
    image: harish123123/docker-skill-exam-2400030320:latest
    build:
      context: ./Parking
      dockerfile: Dockerfile
    container_name: parking-service
    ports:
      - "3201:2024"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/soa-skill-exam-2400030320
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: exam123
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
